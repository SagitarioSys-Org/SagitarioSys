events {}

http {

    server {
        listen 80;
        server_name api.sagitariosys.com.br;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.sagitariosys.com.br;

        ssl_certificate     /etc/nginx/certs/api/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/api/privkey.pem;

        location / {
            proxy_pass         http://sagitariosys-api:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name www.sagitariosys.com.br;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name www.sagitariosys.com.br;

        ssl_certificate     /etc/nginx/certs/front/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/front/privkey.pem;

        location / {
            proxy_pass         http://sagitariosys-front:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
